<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cityscape">
<title>Sign in · Cityscape Schedule</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#f8f9f8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
<meta name="robots" content="noindex">
</head>
<body>
<div class="login">
  <div class="login-brand">
    <svg class="cs-mark" viewBox="18.5 20 64.1 60" aria-hidden="true"><path fill="currentColor" d="M18.5 41.3 39.3 20H61v21.3H39.3V80H18.5zM61 41.3h21.6v14.5L61 80z"/></svg>
    <b>Cityscape</b><span class="tag">SCHEDULE</span>
  </div>
  <form method="post" action="/login">
    <h1>Sign in</h1>
    <p>Check-ins, check-outs, cleaning and linen for the week.</p>
    <label for="un">Username</label>
    <input id="un" name="username" type="text" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required autofocus>
    <label for="pw">Password</label>
    <input id="pw" name="password" type="password" autocomplete="current-password" required>
    <button type="submit">Sign in</button>
    <div class="err" id="err" role="alert"></div>
  </form>
  <div class="login-foot">schedule.yourcityscape.com</div>
</div>
<script>
  // Back to this page after signing in: ask the server again (it sends signed-in people to the app).
  window.addEventListener('pageshow', (ev) => { if (ev.persisted) location.reload(); });
  const q = new URLSearchParams(location.search), e = q.get('e');
  if (q.get('u')) { document.getElementById('un').value = q.get('u'); document.getElementById('pw').focus(); }
  if (e === '1') document.getElementById('err').textContent = 'That username or password isn’t right.';
  if (e === 'locked') document.getElementById('err').textContent = 'Too many attempts — try again in 10 minutes.';
</script>
</body>
</html>
